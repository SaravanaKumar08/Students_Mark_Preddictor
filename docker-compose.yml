
services:

  # ── SERVICE 1: MLflow tracking server ──────────────────────────────
  # Runs the experiment dashboard and stores all training run data.
  # Accessible at http://localhost:5001 on the host machine.
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5001:5000"    # host:container — UI available at localhost:5001
    volumes:
      - mlflow_data:/mlflow   # named volume keeps data between restarts
    restart: unless-stopped

  # ── SERVICE 2: One-off model training job ──────────────────────────
  # Run with: docker compose run --rm train
  # Trains the model, logs to MLflow, writes .pkl back to the host
  # via the bind mount so the API container can use the updated model.
  train:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "train_model.py"]
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000   # "mlflow" = service name above
    volumes:
      - ./student_model.pkl:/app/student_model.pkl   # bind mount: writes back to host
    depends_on:
      - mlflow

  # ── SERVICE 3: Flask prediction API ────────────────────────────────
  # Serves predictions on port 5000. Loads the .pkl from the bind mount
  # written by the train service. Logs every prediction call to MLflow.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"    # Flask API accessible at localhost:5000
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    restart: unless-stopped

# Named volume — data persists even when containers are stopped
volumes:
  mlflow_data: